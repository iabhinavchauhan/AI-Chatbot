<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" xintegrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>AI Chatbot | Contact Us</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f8f8f8;
            color: #333;
        }

        .navbar{
            height: 80px;
            background-color: rgb(1, 73, 73);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: relative;
            z-index: 10;
        }
        
        h1{
            color: #ffffff;
            font-size: 1.8em;
            transition: color 0.3s;
        }

        h1:hover{
            color: aquamarine;
        }
        
        .navbar .nav-items{
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navbar .nav-items .navitem{
            display: inline-block;
            margin-left: 20px;
        }

        .navbar .nav-items a{
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding-bottom: 5px;
            transition: color 0.3s, border-bottom 0.3s;
        }

        .nav-items a:hover{
            border-bottom: 2px solid #ff9900;
            color: #ff9900;
        }
        .hamburger {
            display: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .container{
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 10px;
        }

        .container h2{
            font-size: 2.5em;
            color: #012a31;
            border-bottom: 3px solid #ff9900;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .container p{
            font-size: 1.05em;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .container p:last-of-type {
            margin-bottom: 30px; 
        }

        .contact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 20px;
        }

        .contact-form{
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            flex: 1 1 500px;
        }

        .contact-form form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label, .contact-form p {
            font-weight: 600;
            color: rgb(1, 73, 73);
            margin-bottom: 5px;
        }

        .contact-form input[type="text"],
        .contact-form input[type="email"]{
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .contact-form input[type="text"]:focus,
        .contact-form input[type="email"]:focus{
            border-color: #ff9900;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.2);
        }
        .gender-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .gender-group label {
            font-weight: 400; 
            color: #333;
            margin-right: 5px;
        }
        
        .contact-form input[type="submit"] {
            background-color: rgb(1, 73, 73);
            color: #ffffff;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }
        .contact-form input[type="submit"]:hover {
            background-color: #ff9900;
            transform: translateY(-2px);
        }

        .my-details{
            flex: 1 1 300px;
            background-color: #012a31;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            align-self: flex-start;
        }
        
        .my-details h2 {
            font-size: 1.8em;
            color: #ff9900;
            border-bottom: 2px solid #ff9900;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .my-details ul {
            list-style: none;
            padding: 0;
        }
        .my-details ul li {
            margin-bottom: 15px;
            font-size: 1em;
            line-height: 1.4;
            color: white;
            word-spacing: 5px;
        }
        .my-details a {
            color: #ffc266;
            text-decoration: none;
            word-wrap: break-word;
            transition: color 0.3s;
        }
        .my-details a:hover {
            color: #ffffff;
        }

        .ft {
            padding: 40px 30px;
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 60px;
        }

        .ft p {
            font-weight: 600;
            color: #ffffff;
            margin: 0;
            text-align: left;
            flex-grow: 1;
        }
        
        .ft form {
            margin: 0;
        }

        .ft .btn1{
            width: 150px;
            height: 50px;
            border: 2px solid #ffffff;
            color: #ffffff;
            background-color: transparent;
            font-size: 1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            flex-shrink: 0;
            margin-left: 20px;
        }

        .ft .btn1:hover{
            color: #012a31;
            background-color: #ffffff;
            border-color: #ff9900;
        }

        @media (max-width: 900px) {
            .contact-grid {
                flex-direction: column;
                gap: 30px;
            }
            .contact-form, .my-details {
                flex-basis: 100%;
            }
            .my-details {
                align-self: stretch;
            }
            .ft {
                flex-direction: column;
                padding: 30px 20px;
                text-align: center;
            }
            .ft p {
                font-size: 1.3em;
                text-align: center;
                margin-bottom: 20px;
            }
            .ft .btn1 {
                width: 90%;
                margin: 0;
            }
        }
        @media (max-width: 600px) {
            .navbar {
                padding: 0 20px;
                position: fixed;
                width: 100%;
                top: 0;
                left: 0;
            }
            .hamburger {
                display: block;
            }
            .navbar .nav-items {
                display: none;
                position: absolute;
                top: 80px;
                left: 0;
                width: 100%;
                background-color: rgb(1, 73, 73);
                flex-direction: column;
                padding: 10px 0;
            }
            .navbar .nav-items.active {
                display: flex;
            }
            h1 {
                font-size: 1.5em;
            }
            .container h2 {
                font-size: 2em;
            }
            .container {
                padding-top: 80px; /* Navbar की height के बराबर padding */
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class='navbar'>
            <ul class="nav-items" id="nav-items">
                <li class="navitem"><a href="./index.html">HOME</a></li>
                <li class="navitem"><a href="./Aboutus.html">ABOUT</a></li>
                <li class="navitem"><a href="./Contactus.html">CONTACT</a></li>
            </ul>
            <div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>
        </nav>
        <div class="container">
            <h2>Contact Us</h2>
            
            <div class="contact-grid">
                
                <div class="contact-form">
                    <p style="margin-bottom: 20px;"><strong>Add your details here:</strong></p>
                    <form action="backend.php" method="POST">
                        <div class="form-group">
                            <label for="fullname">Full Name:</label>
                            <input type="text" name="fullname" id="fullname" placeholder="Full Name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail:</label>
                            <input type="email" name="email" id="email" placeholder="Your email id" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number:</label>
                            <input type="text" name="phone" id="phone" placeholder="Your phone number" required>
                        </div>

                        <div class="form-group">
                            <p style="margin-bottom: 10px;">Gender:</p>
                            <div class="gender-group">
                                <input type="radio" name="gender" id="male" value="male">
                                <label for="male">Male</label>

                                <input type="radio" name="gender" id="female" value="female">
                                <label for="female">Female</label>

                                <input type="radio" name="gender" id="other" value="other">
                                <label for="other">Other</label>
                            </div>
                        </div>
                        
                        <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px; margin-top: 10px;">
                            <input type="checkbox" name="terms" id="terms" required style="width: auto;">
                            <label for="terms" style="margin-bottom: 0; color: #333; font-weight: 400;">Terms and conditions applied</label>
                        </div>

                        <input type="submit" value="SUBMIT">
                    </form>
                </div>
                
                <div class="my-details">
                    <h2>My details</h2>
                    <ul>
                        <li><i class="fas fa-envelope"></i><a href="mailto:rajputabhinavch.04@gmail.com"> rajputabhinavch.04@gmail.com</a></li>
                        <li><i class="fab fa-linkedin"></i><a href="https://www.linkedin.com/in/thakurabhinavsinghchauhan/" target="_blank"> ABHINAV CHAUHAN</a></li>
                        <li><i class="fab fa-github"></i><a href="https://github.com/thakurabhinavsinghchauhan" target="_blank"> thakurabhinavsinghchauhan</a></li>
                    </ul>
                </div>

            </div>

            <div class="ft">
                <p>What are you waiting for, try our AI now.</p>
                <form action="https://chat-app-b2f648.zapier.app/chatbot-by-tasc-group" method="GET">
                    <button class="btn1">TRY NOW</button>
                </form>
            </div>
        </div>
    </header>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navItems = document.getElementById('nav-items');

        hamburger.addEventListener('click', () => {
            navItems.classList.toggle('active');
        });
    </script>
</body>
</html>
